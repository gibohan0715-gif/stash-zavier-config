mode: rule
log-level: info
ipv6: false
allow-lan: false
mixed-port: 7890
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost.ptlogin2.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.msftconnecttest.com
  - +.msftncsi.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.google/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    'geosite:cn':
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    '+.*':
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
proxy-providers:
  Subscribe:
    type: http
    url: http://your-service-provider
    interval: 86400
    path: ./Subscribe.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
proxies: []
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - 自动选择
  - 美国节点
  - 香港节点
  - 日本节点
  - 新加坡节点
  - 台湾节点
  - 手动切换
  - DIRECT
- name: 手动切换
  type: select
  use:
  - Subscribe
- name: 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  use:
  - Subscribe
- name: 美国节点
  type: select
  use:
  - Subscribe
  filter: (?i)美|🇺🇸|美国|US|States|American
- name: 香港节点
  type: select
  use:
  - Subscribe
  filter: (?i)港|🇭🇰|香港|HK|Hong
- name: 日本节点
  type: select
  use:
  - Subscribe
  filter: (?i)日|🇯🇵|日本|JP|Japan
- name: 新加坡节点
  type: select
  use:
  - Subscribe
  filter: (?i)坡|🇸🇬|新加坡|狮城|SG|Singapore
- name: 台湾节点
  type: select
  use:
  - Subscribe
  filter: (?i)台|🇹🇼|台湾|TW|Tai
- name: AI
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
  - 日本节点
  - 手动切换
- name: Google
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
  - 手动切换
- name: Telegram
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 新加坡节点
  - 香港节点
  - 手动切换
- name: 流媒体
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
  - 日本节点
  - 手动切换
- name: Emby
  type: select
  proxies:
  - DIRECT
  - 节点选择
- name: Apple服务
  type: select
  proxies:
  - DIRECT
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
- name: 微软服务
  type: select
  proxies:
  - DIRECT
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
- name: 社交
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
  - 新加坡节点
  - 手动切换
- name: 游戏
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
  - 日本节点
  - DIRECT
- name: 音乐
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - 美国节点
  - 香港节点
- name: 漏网之鱼
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - DIRECT
