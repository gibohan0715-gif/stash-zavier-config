mode: rule
log-level: info
ipv6: false
allow-lan: false
mixed-port: 7890
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.google/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    'geosite:cn':
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    'rule-set:DomesticSocial':
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    '+.*':
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
proxy-providers:
  Subscribe:
    type: http
    url: http://your-service-provider
    interval: 86400
    path: ./Subscribe.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  Subscribe2:
    type: http
    url: http://your-service-provider
    interval: 86400
    path: ./Subscribe2.yaml
