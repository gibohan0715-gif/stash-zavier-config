mode: rule
log-level: info
ipv6: false
allow-lan: false
mixed-port: 7890
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.google/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    'geosite:cn':
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.weixin.qq.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.wx.qq.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.qq.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.tencent.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.wechat.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.douyin.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.douyinpic.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.douyinstatic.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.douyincdn.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.douyinvod.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.snssdk.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.bytedance.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.iesdouyin.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.amemv.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.toutiao.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.ixigua.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.pstatp.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.tencent-cloud.net:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    '+.*':
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
proxy-providers:
  Subscribe:
    type: http
    url: http://your-service-provider
    interval: 86400
    path: ./Subscribe.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
proxies: []
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - 自动选择
  - 美国节点
  - 香港节点
  - 日本节点
  - 韩国节点
  - 新加坡节点
  - 台湾节点
  - 手动切换
  - DIRECT
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
- name: 手动切换
  type: select
  use:
  - Subscribe
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png
- name: 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  use:
  - Subscribe
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
- name: 美国节点
  type: select
  use:
  - Subscribe
  filter: (?i)美|🇺🇸|美国|US|States|American
