# Egern config by Muse for Zavier — MagicRule rule sets, DNS split CN->Ali/Tencent, foreign->Google/Cloudflare
# Egern >= v2.20.0 | Import: Egern > 配置 > 从 URL 下载 this file, then replace the 5 placeholder subscription URLs in 手动切换
http_port: 6152
socks_port: 6153
vif_only: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://1.1.1.1/generate_204
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    Domestic-DNS:
    - 223.5.5.5
    - 119.29.29.29
    Domestic-Encrypted-DNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    Foreign-Encrypted-DNS:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://rule2-ze9.pages.dev/data/_shared/artifacts/AdvertisingLite_rules_9124330bac3304f3.yaml
      value: REJECT
      disabled: false
  - proxy_rule_set:
      match: https://rule2-ze9.pages.dev/data/_shared/artifacts/China_rules_2039832124262e98.yaml
      value: Domestic-Encrypted-DNS
      disabled: false
  - domain_wildcard:
      match: '*'
      value: Foreign-Encrypted-DNS
      disabled: false
  hosts:
    dns.google:
    - 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844
    cloudflare-dns.com:
    - 104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9
    dns.alidns.com:
    - 223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1
    doh.pub:
    - 1.12.12.12, 120.53.53.53
    dot.pub:
    - 1.12.12.12, 120.53.53.53
  proxy_nameservers:
  - 119.29.29.29
  - 223.5.5.5
real_ip_domains:
- lancache.steamcontent.com
- '*.msftconnecttest.com'
- '*.msftncsi.com'
- '*.srv.nintendo.net'
- '*.stun.playstation.net'
- xbox.*.microsoft.com
- '*.xboxlive.com'
- '*.logon.battlenet.com.cn'
- '*.logon.battle.net'
- stun.l.google.com
- easy-login.10099.com.cn
- '*-update.xoyocdn.com'
- '*.prod.cloud.netflix.com'
- appboot.netflix.com
- '*-appboot.netflix.com'
policy_groups:
- external:
    name: 手动切换
    type: select
    urls:
    - http://your-service-provider
    - http://your-service-provider
    - http://your-service-provider
    - http://your-service-provider
    - http://your-service-provider
    hidden: false
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png
- select:
    name: 节点选择
    policies:
    - 手动切换
    - 美国节点
    - 香港节点
    - 日本节点
    - 韩国节点
    - 新加坡节点
    - 台湾节点
    - 自动选择
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
- auto_test:
    name: 自动选择
    policies:
    - 手动切换
    flatten: true
    tolerance: 0
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
- auto_test:
    name: 美国节点
    policies:
    - 手动切换
    flatten: true
    filter: (?i)美|🇺🇸|美国|US|States|American
