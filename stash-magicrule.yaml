proxies: []
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - 自动选择
  - 美国节点
  - 香港节点
  - 日本节点
  - 韩国节点
  - 新加坡节点
  - 台湾节点
  - 手动切换
  - DIRECT
  icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
  use:
  - 订阅1
  - 订阅2
  - 订阅3
  - 订阅4
  - 订阅5
- name: 手动切换
  type: select
  use:
  - 订阅1
  - 订阅2
  - 订阅3
  - 订阅4
  - 订阅5
