# Egern 简化版 by Muse for Zavier — 只有国外/国内两个策略 + ApplePush 单独
# 规则集: 国内用 MagicRule 大集合 (China/ChinaIPs/ChinaMedia/ChinaGame/ChinaIPTV),
# 国外用大集合 (GlobalAI/SocialMediaGlobal/GlobalMedia/Global), 不再按单个软件分流
# DNS 转发: 拦截最前, 厂商域名走自家 DNS (腾讯/阿里/百度/网易/抖音), 其余国内域名走 ChinaDNS 大合集 -> 国内DNS, 国外域名走 GlobalDNS 大合集 -> 国外DNS, 其余全部走兜底 -> 国外DNS
# Egern >= v2.20.0 | 导入: Egern > 配置 > 从 URL 下载本文件, 然后把 国外 里的 5 个占位订阅链接换成自己的订阅链接
http_port: 6152
socks_port: 6153
vif_only: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://1.1.1.1/generate_204
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    腾讯:
    - https://doh.pub/dns-query
    - https://1.12.12.12/dns-query
    阿里:
    - https://dns.alidns.com/dns-query
    - https://223.5.5.5/dns-query
    百度:
    - 180.76.76.76
    网易:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    抖音:
    - 180.184.1.1
    - 180.184.2.2
    国内DNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    国外DNS:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/AdvertisingLite.yaml
      value: REJECT
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/Privacy.yaml
      value: REJECT
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/Tencent.yaml
      value: 腾讯
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/Alibaba.yaml
      value: 阿里
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/Baidu.yaml
      value: 百度
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/NetEase.yaml
      value: 网易
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/NetEaseMusic.yaml
      value: 网易
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/DouYin.yaml
      value: 抖音
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/ChinaDNS.yaml
      value: 国内DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/gibohan0715-gif/stash-zavier-config/main/rules/GlobalDNS.yaml
      value: 国外DNS
      disabled: false
  - domain_wildcard:
      match: '*'
      value: 国外DNS
      disabled: false
  hosts:
    dns.google:
    - 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844
    cloudflare-dns.com:
    - 104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9
    dns.alidns.com:
    - 223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1
    doh.pub:
    - 1.12.12.12, 120.53.53.53
    dot.pub:
    - 1.12.12.12, 120.53.53.53
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
real_ip_domains:
- lancache.steamcontent.com
- '*.msftconnecttest.com'
- '*.msftncsi.com'
- '*.srv.nintendo.net'
- '*.stun.playstation.net'
- xbox.*.microsoft.com
- '*.xboxlive.com'
- '*.logon.battlenet.com.cn'
- '*.logon.battle.net'
- stun.l.google.com
- easy-login.10099.com.cn
- '*-update.xoyocdn.com'
- '*.prod.cloud.netflix.com'
- appboot.netflix.com
- '*-appboot.netflix.com'
policy_groups:
- external:
    name: 订阅
    type: select
    urls:
    - http://your-service-provider
    hidden: false
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png
- select:
    name: 国外
    policies:
    - 订阅
    - 美国节点
    - 香港节点
    - 日本节点
    - 韩国节点
    - 新加坡节点
    - 台湾节点
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
- select:
    name: 国内
    policies:
    - DIRECT
    - 美国节点
    - 香港节点
    - 日本节点
    - 韩国节点
    - 新加坡节点
    - 台湾节点
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
- auto_test:
    name: 美国节点
    policies:
    - 订阅
    flatten: true
    filter: (?i)美|🇺🇸|美国|US|States|American
    tolerance: 0
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
- auto_test:
    name: 香港节点
    policies:
    - 订阅
    flatten: true
    filter: (?i)港|🇭🇰|香港|HK|Hong
    tolerance: 0
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
- auto_test:
    name: 日本节点
    policies:
    - 订阅
    flatten: true
    filter: (?i)日|🇯🇵|日本|JP|Japan|东京|Tokyo
    tolerance: 0
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png
- auto_test:
    name: 韩国节点
    policies:
    - 订阅
    flatten: true
    filter: (?i)韩|🇰🇷|韩国|KR|Korea|首尔|Seoul
    tolerance: 0
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Korea.png
- auto_test:
    name: 新加坡节点
    policies:
    - 订阅
    flatten: true
    filter: (?i)新加坡|🇸🇬|狮|SG|Singapore
    tolerance: 0
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
- auto_test:
    name: 台湾节点
    policies:
    - 订阅
    flatten: true
    filter: (?i)台|🇹🇼|台湾|TW|Taiwan
    tolerance: 0
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png
- select:
    name: ApplePush
    policies:
    - 国外
    - DIRECT
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
